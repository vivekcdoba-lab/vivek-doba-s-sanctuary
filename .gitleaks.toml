# Gitleaks config — VDTS
# Allowlist intentionally-public Supabase publishable/anon keys and
# project identifiers that are safe to ship in the client bundle.
title = "VDTS Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Allow public Supabase identifiers and known fixtures"
paths = [
  '''node_modules/''',
  '''dist/''',
  '''bun\.lockb$''',
  '''package-lock\.json$''',
  '''\.lovable/''',
  '''supabase/migrations/''',          # historical SQL — no live secrets
  '''src/integrations/supabase/types\.ts$''',
]
regexes = [
  # Supabase anon/publishable JWTs (role: "anon") — public by design
  '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+anon[A-Za-z0-9_\-\.]+''',
  # Supabase project ref (public)
  '''pobjadmnmfbeydqsymhx''',
  # Lovable project id (public)
  '''9f404a7e-486e-4ce4-9e52-48e654e53aad''',
]
stopwords = [
  "VITE_SUPABASE_PUBLISHABLE_KEY",
  "VITE_SUPABASE_URL",
  "VITE_SUPABASE_PROJECT_ID",
  "SUPABASE_PUBLISHABLE_KEY",
  "SUPABASE_ANON_KEY",
]
